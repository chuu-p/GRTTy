syntax = "proto3";

package example;

message Todo {
  int64 id = 1;
  string title = 2;
  string description = 3;
  bool completed = 4;
}

message TodoId {
  int64 id = 1;
}

message TodoList {
  repeated Todo todos = 1;
}

message Empty {}

service TodoService {
  rpc AddTodo (Todo) returns (Todo);
  rpc GetTodos (Empty) returns (TodoList);
  rpc DeleteTodo (TodoId) returns (Empty);
  rpc UpdateTodo (Todo) returns (Todo);
}

